[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghci"
dynamic = ["version"]
description = "GitHub Actions CI status and watch for any repo (ghci), and cleanup of your PRs, forks and clones (ghclean)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
completion = ["argcomplete"]

[project.scripts]
ghci = "ghci.actions:main"
ghclean = "ghci.clean:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.dynamic]
version = { attr = "ghci.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ghci"]
